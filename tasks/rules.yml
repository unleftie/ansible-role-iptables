---
- name: Set rules
  notify:
    - save_iptables_rules_redhat_ipv4
    - save_iptables_rules_debian_ipv4
    - save_iptables_rules_redhat_ipv6
    - save_iptables_rules_debian_ipv6
  block:
    - name: Allow loopback interface for INPUT
      iptables:
        ip_version: "{{ item }}"
        chain: INPUT
        in_interface: lo
        state: present
        action: insert
        rule_num: 1
        jump: ACCEPT
        comment: "loopback interface"
      loop: ["ipv4", "ipv6"]

    - name: Allow loopback interface for OUTPUT
      iptables:
        ip_version: "{{ item }}"
        chain: OUTPUT
        out_interface: lo
        state: present
        action: insert
        rule_num: 1
        jump: ACCEPT
        comment: "loopback interface"
      loop: ["ipv4", "ipv6"]

    # quickly process packets for which we already have a connection
    - name: Allow connections with ESTABLISHED and RELATED state
      iptables:
        ip_version: "{{ item.ip_version }}"
        chain: "{{ item.chain }}"
        state: present
        action: insert
        rule_num: 2
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT
        comment: "established and related state"
      loop:
        - { chain: "INPUT", ip_version: "ipv4" }
        - { chain: "OUTPUT", ip_version: "ipv4" }
        - { chain: "INPUT", ip_version: "ipv6" }
        - { chain: "OUTPUT", ip_version: "ipv6" }

    - name: Drop connections with INVALID state
      iptables:
        ip_version: "{{ item }}"
        chain: INPUT
        state: present
        action: insert
        rule_num: 3
        ctstate: INVALID
        jump: DROP
        comment: "invalid state"
      loop: ["ipv4", "ipv6"]

    - name: Allow dhcp client
      iptables:
        ip_version: "{{ item.ip_version }}"
        chain: INPUT
        state: present
        source_port: "{{ item.source_port }}"
        destination_port: "{{ item.destination_port }}"
        protocol: udp
        jump: ACCEPT
        comment: "dhcp client"
      loop:
        - { source_port: 67, destination_port: 68, ip_version: "ipv4" }
        - { source_port: 547, destination_port: 546, ip_version: "ipv6" }
      when: iptables_dhcp_client_allow | bool

    - name: Allow internal network communication
      iptables:
        ip_version: "ipv4"
        chain: INPUT
        state: present
        source: "{{ iptables_internal_ip_pool }}"
        protocol: "all"
        jump: ACCEPT
        comment: "internal network communication"
      when: iptables_allow_internal | bool

    - name: Allow icmp from external (ipv4)
      iptables:
        ip_version: "ipv4"
        chain: INPUT
        state: present
        protocol: icmp
        icmp_type: "{{ item }}"
        jump: ACCEPT
        comment: "icmp type {{ item }}"
      loop: [3, 8, 11]

    - name: Allow icmp from external (ipv6)
      iptables:
        ip_version: "ipv6"
        chain: INPUT
        state: present
        protocol: icmpv6
        icmp_type: "{{ item }}"
        jump: ACCEPT
        comment: "icmpv6 type {{ item }}"
      loop: [1, 2, 3, 4, 128, 129, 133, 134, 135, 136]

    - name: Allow ssh from all
      iptables:
        ip_version: "{{ item }}"
        chain: INPUT
        protocol: tcp
        destination_port: "{{ iptables_ssh_port }}"
        state: present
        action: insert
        rule_num: 4
        ctstate: NEW,ESTABLISHED
        jump: ACCEPT
        comment: "ssh from external"
      loop: ["ipv4", "ipv6"]

    - name: Allow forwarding of established and related connections (ipv4)
      iptables:
        ip_version: "ipv4"
        chain: FORWARD
        state: present
        action: insert
        rule_num: 1
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT
        comment: "established and related state"
      when: iptables_ipv4_nat | bool

    - name: Allow forwarding of new connections for NAT (ipv4)
      iptables:
        ip_version: "ipv4"
        chain: FORWARD
        state: present
        source: "{{ iptables_ipv4_nat_source_pool }}"
        ctstate: NEW
        jump: ACCEPT
        comment: "forward new connections for nat"
      when: iptables_ipv4_nat | bool

    - name: Allow forwarding of established and related connections (ipv6)
      iptables:
        ip_version: "ipv6"
        chain: FORWARD
        state: present
        action: insert
        rule_num: 1
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT
        comment: "established and related state"
      when: iptables_ipv6_nat | bool

    - name: Allow forwarding of new connections for NAT (ipv6)
      iptables:
        ip_version: "ipv6"
        chain: FORWARD
        state: present
        source: "{{ iptables_ipv6_nat_source_pool }}"
        ctstate: NEW
        jump: ACCEPT
        comment: "forward new connections for nat"
      when: iptables_ipv6_nat | bool

    - name: Allow NAT (ipv4)
      iptables:
        ip_version: "ipv4"
        chain: POSTROUTING
        table: nat
        out_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
        state: present
        jump: MASQUERADE
        comment: "default nat"
      when:
        - iptables_ipv4_nat | bool
        - ansible_facts['default_ipv4']['interface'] is defined

    - name: Allow NAT (ipv6)
      iptables:
        ip_version: "ipv6"
        chain: POSTROUTING
        table: nat
        out_interface: "{{ ansible_facts['default_ipv6']['interface'] }}"
        state: present
        jump: MASQUERADE
        comment: "default nat"
      when:
        - iptables_ipv6_nat | bool
        - ansible_facts['default_ipv6']['interface'] is defined
